name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run core:verify
      - run: npm ci
      - run: npm run core:verify-installed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-evidence
          path: evidence/*.png
