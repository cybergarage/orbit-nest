<svg xmlns="http://www.w3.org/2000/svg" width="520" height="825" viewBox="0 0 520 825" role="img" aria-labelledby="title desc">
<title id="title">Role blueprint to a personal Bot</title><desc id="desc">Original conceptual diagram. Not actual product UI or an accepted specification. 2026-10-04.</desc>
<rect width="520" height="825" fill="#f4f6fb"/>
<text x="24" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#182338">Role blueprint to a personal Bot</text>
<text x="24" y="92" font-family="sans-serif" font-size="18" fill="#526078">Original conceptual diagram | 2026-10-04</text>
<text x="24" y="114" font-family="sans-serif" font-size="18" fill="#526078">Not actual UI or an accepted specification</text>
<rect x="16" y="135" width="488" height="214" rx="14" fill="white" stroke="#d1d9e8"/>
<text x="30" y="164" font-family="sans-serif" font-size="22" font-weight="bold" fill="#182338">1. Reuse a role</text>
<rect x="30" y="178" width="460" height="40" rx="7" fill="#e8effb"/>
<text x="42" y="205" font-family="sans-serif" font-size="20" fill="#183d76">Bot library / saved blueprint</text>
<rect x="30" y="238" width="460" height="40" rx="7" fill="#e8effb"/>
<text x="42" y="265" font-family="sans-serif" font-size="20" fill="#183d76">My Bot instance</text>
<path d="M 260 221 v 13 m -6 -6 l 6 6 6 -6" fill="none" stroke="#516d97" stroke-width="2"/>
<text x="30" y="307" font-family="sans-serif" font-size="18" fill="#526078">Synthetic role: Manuscript editor. A blueprint</text>
<text x="30" y="331" font-family="sans-serif" font-size="18" fill="#526078">is not a conversation.</text>
<rect x="16" y="365" width="488" height="214" rx="14" fill="white" stroke="#d1d9e8"/>
<text x="30" y="394" font-family="sans-serif" font-size="22" font-weight="bold" fill="#182338">2. Bound the context</text>
<rect x="30" y="408" width="460" height="40" rx="7" fill="#e8effb"/>
<text x="42" y="435" font-family="sans-serif" font-size="20" fill="#183d76">Instance memory + scope</text>
<rect x="30" y="468" width="460" height="40" rx="7" fill="#e8effb"/>
<text x="42" y="495" font-family="sans-serif" font-size="20" fill="#183d76">Conversation / one-off / recurring work</text>
<path d="M 260 451 v 13 m -6 -6 l 6 6 6 -6" fill="none" stroke="#516d97" stroke-width="2"/>
<text x="30" y="537" font-family="sans-serif" font-size="18" fill="#526078">Each instance retains its own memory and</text>
<text x="30" y="561" font-family="sans-serif" font-size="18" fill="#526078">approved source scope.</text>
<rect x="16" y="595" width="488" height="214" rx="14" fill="white" stroke="#d1d9e8"/>
<text x="30" y="624" font-family="sans-serif" font-size="22" font-weight="bold" fill="#182338">3. Observe and control</text>
<rect x="30" y="638" width="460" height="40" rx="7" fill="#e8effb"/>
<text x="42" y="665" font-family="sans-serif" font-size="20" fill="#183d76">Work board / next run / result</text>
<rect x="30" y="698" width="460" height="40" rx="7" fill="#e8effb"/>
<text x="42" y="725" font-family="sans-serif" font-size="20" fill="#183d76">Review / stop / consequential approval</text>
<path d="M 260 681 v 13 m -6 -6 l 6 6 6 -6" fill="none" stroke="#516d97" stroke-width="2"/>
<text x="30" y="767" font-family="sans-serif" font-size="18" fill="#526078">Future delegation needs a separately defined</text>
<text x="30" y="791" font-family="sans-serif" font-size="18" fill="#526078">boundary.</text>
</svg>